<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Reader</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  html, body {
    margin: 0; height: 100%;
    background: #111418; color: #f4f1e8;
    font-family: "Andika", "Verdana", "DejaVu Sans", sans-serif;
    overflow: hidden; cursor: none;
  }
  #stage {
    height: 100%; box-sizing: border-box; padding: 4vh 6vw;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
  }
  #typing { font-size: 14vh; letter-spacing: 0.08em; min-height: 1.2em; }
  #letters { white-space: pre; }
  #cursor { color: #f2c14e; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #fix { font-size: 6vh; line-height: 1.3; color: #8a93a0; min-height: 1.3em; margin-bottom: 2vh; }
  #fix b { color: #f2c14e; font-weight: normal; }
  #sentence { font-size: 11vh; line-height: 1.3; max-width: 90vw; }
  #sentence mark { background: none; color: #f2c14e; }
  .hidden { display: none; }
  #trap { position: absolute; left: -9999px; top: 0; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="typing"><span id="letters"></span><span id="cursor">_</span></div>
  <div id="answer" class="hidden">
    <div id="fix"></div>
    <div id="sentence"></div>
  </div>
</div>
<input id="trap" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<script>
(function () {
  var trap = document.getElementById('trap');
  var lettersEl = document.getElementById('letters');
  var cursorEl = document.getElementById('cursor');
  var typingEl = document.getElementById('typing');
  var answerEl = document.getElementById('answer');
  var fixEl = document.getElementById('fix');
  var sentenceEl = document.getElementById('sentence');

  var word = '';
  var busy = false;
  var showing = false;

  function focusTrap() { trap.focus(); }
  trap.addEventListener('blur', function () { setTimeout(focusTrap, 0); });
  document.addEventListener('click', focusTrap);
  window.addEventListener('load', focusTrap);
  focusTrap();

  function render() {
    lettersEl.textContent = word;
    cursorEl.textContent = busy ? '…' : '_';
  }

  function escapeHTML(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function showAnswer(res) {
    // One line per misspelled word.
    var lines = [];
    var fixes = res.fixes || [];
    for (var i = 0; i < fixes.length; i++) {
      lines.push('<div>' + escapeHTML(fixes[i].from) + ' → <b>' + escapeHTML(fixes[i].to) + '</b></div>');
    }
    fixEl.innerHTML = lines.join('');
    var words = res.word.replace(/[^a-z ]/g, '').split(' ').join('|');
    var html = escapeHTML(res.sentence);
    if (words) {
      html = html.replace(new RegExp('\\b(' + words + ')(\\w*)', 'gi'), '<mark>$1$2</mark>');
    }
    sentenceEl.innerHTML = html;
    typingEl.className = 'hidden';
    answerEl.className = '';
    showing = true;
  }

  function showError() {
    fixEl.innerHTML = '';
    sentenceEl.textContent = 'Oops! Try again.';
    typingEl.className = 'hidden';
    answerEl.className = '';
    showing = true;
  }

  function clearAnswer() {
    answerEl.className = 'hidden';
    typingEl.className = '';
    showing = false;
  }

  function send() {
    word = word.replace(/ +$/, '');
    if (!word || busy) return;
    busy = true;
    render();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/sentence');
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 15000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      busy = false;
      var res = null;
      if (xhr.status === 200) {
        try { res = JSON.parse(xhr.responseText); } catch (e) { res = null; }
      }
      word = '';
      render();
      if (res) showAnswer(res); else showError();
    };
    xhr.send(JSON.stringify({ word: word }));
  }

  // Read keys via keydown; the input only exists to hold focus.
  trap.addEventListener('keydown', function (e) {
    var key = e.key || '';
    var code = e.keyCode;
    if (busy) { e.preventDefault(); return; }

    if (key === 'Enter' || code === 13) {
      e.preventDefault();
      send();
      return;
    }
    if (key === 'Escape' || code === 27) {
      e.preventDefault();
      word = '';
      clearAnswer();
      render();
      return;
    }
    if (key === 'Backspace' || code === 8) {
      e.preventDefault();
      if (showing) clearAnswer();
      word = word.slice(0, -1);
      render();
      return;
    }

    var ch = key.length === 1 ? key : (code >= 65 && code <= 90 ? String.fromCharCode(code) : '');
    if (/^[a-zA-Z]$/.test(ch)) {
      e.preventDefault();
      if (showing) { clearAnswer(); word = ''; }
      if (word.length < 60) word += ch.toLowerCase();
      render();
      return;
    }

    // Space separates words: no leading or double spaces, at most 5 words.
    if (key === ' ' || key === 'Spacebar' || code === 32) {
      e.preventDefault();
      if (showing || !word || word.charAt(word.length - 1) === ' ') return;
      if (word.split(' ').length >= 5) return;
      word += ' ';
      render();
    }
  });

  trap.addEventListener('input', function () { trap.value = ''; });

  render();
})();
</script>
</body>
</html>
